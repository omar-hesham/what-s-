[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "owi"
version = "1.0.0"
description = "Omar WhatsApp Intelligence (OWI)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.28",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "python-multipart>=0.0.9",
    "pypdf>=4.1.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.2",
    "pillow>=10.2.0",
    "psutil>=5.9.8",
    "httpx>=0.27.0",
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["owi*"]
