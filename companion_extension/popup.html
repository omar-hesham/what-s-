<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>OWI Companion</title>
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
    }
    h1 {
      font-size: 15px;
      margin-top: 0;
      color: #25D366;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    p {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.4;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 12.5px;
      cursor: pointer;
      text-align: center;
    }
    .btn:hover {
      background: #1d4ed8;
    }
    .btn-green {
      background: #059669;
    }
    .btn-green:hover {
      background: #047857;
    }
    #status {
      margin-top: 10px;
      font-size: 11px;
      padding: 6px 10px;
      border-radius: 6px;
      display: none;
    }
    .status-success {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid #10b981;
    }
    .status-error {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid #ef4444;
    }
  </style>
</head>
<body>
  <h1>● رفيق واتساب ويب (OWI)</h1>
  <p>التقاط بطلب المستخدم وإرسال إلى تطبيق عمر للذكاء الاصطناعي المحلي.</p>

  <button id="capture-visible" class="btn btn-green">📥 التقاط الرسائل المرئية الحالية</button>
  <button id="open-owi" class="btn">🚀 فتح تطبيق OWI المحلي</button>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
